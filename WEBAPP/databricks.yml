bundle:
  name: rai-whatif-webapp

sync:
  include:
    - frontend/dist/**
  exclude:
    - .databricks/**
    - frontend/src/**
    - frontend/public/**
    - frontend/node_modules/**
    - frontend/index.html
    - frontend/vite.config.js
    - frontend/eslint.config.js
    - frontend/package.json
    - frontend/package-lock.json
    - frontend/README.md

workspace:
  host: https://adb-2148885194133801.1.azuredatabricks.net
  root_path: /Workspace/Shared/DeployedWebApp/bundle/${bundle.name}

targets:
  dev:
    default: true

resources:
  apps:
    rai_whatif_webapp:
      name: rai-whatif-webapp
      source_code_path: .
      description: RAI What-If Web App
      permissions:
        - level: CAN_MANAGE
          group_name: users
