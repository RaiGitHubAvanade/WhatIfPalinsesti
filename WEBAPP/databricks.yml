bundle:
  name: rai-whatif-webapp

artifacts:
  frontend:
    type: custom
    path: ./frontend
    build: |
      npm install
      npm run build

sync:
  include:
    - frontend/dist/**
  exclude:
    - frontend/src/**
    - frontend/public/**
    - frontend/node_modules/**
    - frontend/index.html
    - frontend/vite.config.js
    - frontend/eslint.config.js
    - frontend/package.json
    - frontend/package-lock.json
    - frontend/README.md

workspace:
  host: https://adb-2148885194133801.1.azuredatabricks.net
  auth_type: pat

targets:
  dev:
    mode: development

resources:
  apps:
    rai_whatif_webapp:
      name: rai-whatif-webapp
      source_code_path: .
      description: RAI What-If Web App


